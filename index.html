<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="icon" type="image/png" href="todo-icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 My To-Do List</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a task...">
            <button onclick="addTask()">Add</button>
        </div>

        <div class="filters">
            <button onclick="showTasks('all')">All</button>
            <button onclick="showTasks('pending')">Pending</button>
            <button onclick="showTasks('completed')">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add one above! 🎯</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
